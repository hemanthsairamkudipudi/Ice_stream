services:
  flink-jobmanager:
    image: flink:2.3.0-scala_2.12
    container_name: icestream-flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 2
    volumes:
      - ../flink/lib/iceberg-flink-runtime-2.3-1.12.0.jar:/opt/flink/lib/iceberg-flink-runtime-2.3-1.12.0.jar
      - ../flink/lib/iceberg-aws-bundle-1.12.0.jar:/opt/flink/lib/iceberg-aws-bundle-1.12.0.jar
      - ../flink/lib/hadoop-common-3.4.2.jar:/opt/flink/lib/hadoop-common-3.4.2.jar
      - ../flink/lib/hadoop-hdfs-client-3.4.2.jar:/opt/flink/lib/hadoop-hdfs-client-3.4.2.jar
      - ../flink/lib/woodstox-core-7.1.1.jar:/opt/flink/lib/woodstox-core-7.1.1.jar
      - ../flink/lib/stax2-api-4.2.2.jar:/opt/flink/lib/stax2-api-4.2.2.jar
      
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - icestream

  flink-taskmanager:
    image: flink:2.3.0-scala_2.12
    container_name: icestream-flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
    volumes:
      - ../flink/lib/iceberg-flink-runtime-2.3-1.12.0.jar:/opt/flink/lib/iceberg-flink-runtime-2.3-1.12.0.jar
      - ../flink/lib/iceberg-aws-bundle-1.12.0.jar:/opt/flink/lib/iceberg-aws-bundle-1.12.0.jar
      - ../flink/lib/hadoop-common-3.4.2.jar:/opt/flink/lib/hadoop-common-3.4.2.jar
      - ../flink/lib/hadoop-hdfs-client-3.4.2.jar:/opt/flink/lib/hadoop-hdfs-client-3.4.2.jar
      - ../flink/lib/woodstox-core-7.1.1.jar:/opt/flink/lib/woodstox-core-7.1.1.jar
      - ../flink/lib/stax2-api-4.2.2.jar:/opt/flink/lib/stax2-api-4.2.2.jar
      
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - icestream

  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    container_name: icestream-iceberg-rest
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://object-store:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    depends_on:
      - object-store
    networks:
      - icestream

  object-store:
    image: rustfs/rustfs:1.0.0
    container_name: icestream-rustfs
    environment:
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: password
      RUSTFS_OBS_LOG_STDOUT_ENABLED: "true"
      RUSTFS_SERVER_DOMAINS: object-store
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - icestream

networks:
  icestream:
    name: icestream-network